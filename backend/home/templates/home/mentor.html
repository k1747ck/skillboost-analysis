<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Mentor — SkillBoost</title>
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 18px; box-shadow: 0 8px 25px rgba(0,0,0,0.12); max-width: 480px; width: 100%; text-align: center; }
        h1 { font-size: 24px; color: #1a1a18; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
        .info-box { background: #EEF3FF; border-radius: 10px; padding: 16px; margin-bottom: 20px; font-size: 14px; color: #2563EB; }
        a.btn { display: inline-block; padding: 12px 28px; background: #2563EB; color: white; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; }
        a.btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<div class="card">
    <h1>Contact Your Mentor</h1>
    <p>You don't have an account yet. Please reach out to your academic mentor or administrator to get your login credentials.</p>
    <div class="info-box">
        Your mentor will provide your <strong>Roll Number</strong> and <strong>Password</strong> to access the SkillBoost dashboard.
    </div>
    <a href="/login/" class="btn">← Back to Login</a>
</div>
</body>
</html>
