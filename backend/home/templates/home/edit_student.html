<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Student — SkillBoost</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #F7F7F5; --surface: #FFFFFF; --border: #E8E8E4; --text-primary: #1A1A18; --text-secondary: #6B6B65; --text-muted: #9E9E96; --accent: #2563EB; --accent-light: #EEF3FF; --radius: 12px; --radius-sm: 8px; --shadow: 0 1px 3px rgba(0,0,0,0.06); }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; font-size: 15px; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 28px 0; z-index: 100; overflow-y: auto; }
  .sidebar-logo { padding: 0 24px 28px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .sidebar-logo span { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .sidebar-logo small { display: block; font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; margin-top: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 24px; color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.15s; border-left: 3px solid transparent; }
  .nav-item:hover { background: var(--bg); color: var(--text-primary); }
  .nav-item.active { color: var(--accent); background: var(--accent-light); border-left-color: var(--accent); }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-footer { margin-top: auto; padding: 16px 24px 0; border-top: 1px solid var(--border); }
  .sidebar-footer p { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .sidebar-footer strong { color: var(--text-primary); display: block; margin-bottom: 10px; font-size: 13px; }
  .sidebar-footer a.run-btn { display: block; text-align: center; padding: 9px; background: var(--accent); color: white; border-radius: var(--radius-sm); text-decoration: none; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .sidebar-footer a.logout { display: block; text-align: center; padding: 9px; background: #fee2e2; color: #dc2626; border-radius: var(--radius-sm); text-decoration: none; font-size: 13px; font-weight: 500; }
  .main { margin-left: 220px; padding: 36px 40px; }
  .page-header { margin-bottom: 32px; }
  .page-header h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }
  .page-header p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); max-width: 820px; }
  .section-block { margin-bottom: 28px; }
  .section-title { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  input, select { font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text-primary); transition: border-color 0.15s; outline: none; width: 100%; }
  input:focus, select:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px #2563EB18; }
  .form-actions { display: flex; gap: 12px; padding-top: 24px; border-top: 1px solid var(--border); margin-top: 8px; }
  .btn-primary { padding: 11px 28px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary { padding: 11px 20px; background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; }
  .btn-secondary:hover { background: var(--bg); }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><span>SkillBoost</span><small>Analytics Platform</small></div>
  <nav>
    <a href="/" class="nav-item"><span class="nav-icon">⊞</span> Dashboard</a>
    <a href="/students/" class="nav-item"><span class="nav-icon">◎</span> Students</a>
    <a href="/predict/" class="nav-item"><span class="nav-icon">◈</span> ML Prediction</a>
    <a href="/add/" class="nav-item"><span class="nav-icon">＋</span> Add Student</a>
  </nav>
  <div class="sidebar-footer">
    <p>Logged in as</p>
    <strong>{{ request.session.student_name }}</strong>
    <a href="/predict/" class="run-btn">Run Prediction →</a>
    <a href="/logout/" class="logout">Logout</a>
  </div>
</aside>
<main class="main">
  <div class="page-header"><h1>Edit Student</h1><p>Update details for {{ student.name }}</p></div>
  <div class="form-card">
    <form method="POST">
      {% csrf_token %}
      <div class="section-block">
        <div class="section-title">Basic information</div>
        <div class="form-row three">
          <div class="form-group"><label>Student ID</label><input type="text" name="student_id" value="{{ student.student_id }}" required></div>
          <div class="form-group"><label>Full Name</label><input type="text" name="name" value="{{ student.name }}" required></div>
          <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ student.email }}" required></div>
        </div>
        <div class="form-group"><label>Course</label><input type="text" name="course" value="{{ student.course }}" required></div>
      </div>
      <div class="section-block">
        <div class="section-title">Academic details</div>
        <div class="form-row three">
          <div class="form-group"><label>Attendance %</label><input type="number" name="attendance_percentage" step="0.01" value="{{ student.attendance_percentage }}" required></div>
          <div class="form-group"><label>Mid-Term Marks</label><input type="number" name="mid_term_marks" step="0.01" value="{{ student.mid_term_marks }}" required></div>
          <div class="form-group"><label>Assignment Score</label><input type="number" name="assignment_score" step="0.01" value="{{ student.assignment_score }}" required></div>
        </div>
        <div class="form-row three">
          <div class="form-group"><label>Class Participation (0–10)</label><input type="number" name="class_participation" step="0.01" value="{{ student.class_participation }}" required></div>
          <div class="form-group"><label>Activity Participation</label><select name="activity_participation" required><option value="yes" {% if student.activity_participation == 'yes' %}selected{% endif %}>Yes</option><option value="no" {% if student.activity_participation == 'no' %}selected{% endif %}>No</option></select></div>
          <div class="form-group"><label>Aggregate Academic Score</label><input type="number" name="aggregate_academic_score" step="0.01" value="{{ student.aggregate_academic_score }}" required></div>
        </div>
      </div>
      <div class="section-block">
        <div class="section-title">Training details</div>
        <div class="form-row three">
          <div class="form-group"><label>Attended Training?</label><select name="training_attendance" required><option value="yes" {% if student.training_attendance == 'yes' %}selected{% endif %}>Yes</option><option value="no" {% if student.training_attendance == 'no' %}selected{% endif %}>No</option></select></div>
          <div class="form-group"><label>Training Score</label><input type="number" name="training_score" step="0.01" value="{{ student.training_score }}" required></div>
          <div class="form-group"><label>Feedback Rating (0–5)</label><input type="number" name="feedback_rating" step="0.1" value="{{ student.feedback_rating }}" required></div>
        </div>
        <div class="form-row three">
          <div class="form-group"><label>Pre-Training Score</label><input type="number" name="pre_training_score" step="0.01" value="{{ student.pre_training_score }}" required></div>
          <div class="form-group"><label>Post-Training Score</label><input type="number" name="post_training_score" step="0.01" value="{{ student.post_training_score }}" required></div>
          <div class="form-group"><label>Improvement</label><input type="number" name="improvement" step="0.01" value="{{ student.improvement }}" required></div>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary">Update Student</button>
        <a href="/" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
